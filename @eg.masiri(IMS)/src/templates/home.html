{% extends "base.html" %} {% block title %}Masiri{% endblock %} {% block
extra_head %}
<style>
    .home-hero {
        min-height: 70vh;
    }

    .home-welcome {
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        letter-spacing: 0.01em;
        animation: ms-rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }

    .home-lead {
        animation: ms-rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) 0.15s both;
    }

    @keyframes ms-rise {
        from {
            opacity: 0;
            transform: translateY(14px);
        }

        to {
            opacity: 1;
            transform: none;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .home-welcome,
        .home-lead {
            animation: none;
        }
    }
</style>
{% endblock %} {% block content %}
<div
    class="home-hero d-flex flex-column justify-content-center align-items-center text-center px-3"
>
    <h1 class="home-welcome mb-3">Welcome to Masiri</h1>
    <p class="ms-lead home-lead mb-0">
        Every item in your store, tracked from shelf to sale.
    </p>
</div>
{% endblock %}
